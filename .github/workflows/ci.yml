name: CI - NutriGraph AI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-user-auth-service:
    name: Test User & Auth Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/user-auth-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/user-auth-service/requirements.txt

      - name: Run Pytest
        working-directory: services/user-auth-service
        env:
          PYTHONPATH: .
          JWT_SECRET: ci_jwt_secret_key_12345
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: pytest -v

  test-nutrition-graph-service:
    name: Test Nutrition Graph Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/nutrition-graph-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/nutrition-graph-service/requirements.txt

      - name: Run Pytest
        working-directory: services/nutrition-graph-service
        env:
          PYTHONPATH: .
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: pytest -v

  test-ai-agent-service:
    name: Test AI Agent Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-agent-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-agent-service/requirements.txt

      - name: Run Pytest
        working-directory: services/ai-agent-service
        env:
          PYTHONPATH: .
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          REDIS_URL: redis://localhost:6379/0
          NUTRITION_GRAPH_SERVICE_URL: http://localhost:8001/api/v1
        run: pytest -v

  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/angular-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/angular-app
        run: npm ci

      - name: Build Angular Project
        working-directory: frontend/angular-app
        run: npm run build

      - name: Run Angular Unit Tests
        working-directory: frontend/angular-app
        run: npm run test -- --watch=false

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-auth-service Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-auth-service
          file: ./services/user-auth-service/Dockerfile
          push: false

      - name: Build nutrition-graph-service Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/nutrition-graph-service/Dockerfile
          push: false

      - name: Build ai-agent-service Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/ai-agent-service/Dockerfile
          push: false

      - name: Build frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/angular-app
          file: ./frontend/angular-app/Dockerfile
          push: false
