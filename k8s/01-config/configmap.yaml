apiVersion: v1
kind: ConfigMap
metadata:
  name: nutrigraph-config
  namespace: default
  labels:
    app.kubernetes.io/part-of: nutrigraph-ai
data:
  # Microservices Configuration
  PROJECT_NAME_USER_AUTH: "User & Auth Service"
  PROJECT_NAME_NUTRITION: "Nutrition Graph Service"
  PROJECT_NAME_AI_AGENT: "AI Agent Service"

  # Infrastructure URLs
  NEO4J_URI: "bolt://neo4j:7687"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  CONSUL_HOST: "consul"
  CONSUL_PORT: "8500"

  # LLM Service Defaults
  OPENAI_API_BASE: "https://openrouter.ai/api/v1"
  LLM_MODEL: "google/gemini-2.5-pro"

  # Service Communication URLs
  NUTRITION_GRAPH_SERVICE_URL: "http://nutrition-graph-service:8000/api/v1"
