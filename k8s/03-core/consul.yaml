apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: default
  labels:
    app: consul
    app.kubernetes.io/part-of: nutrigraph-ai
    app.kubernetes.io/component: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.15
          command:
            - "agent"
            - "-dev"
            - "-client=0.0.0.0"
          ports:
            - containerPort: 8500
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: default
  labels:
    app: consul
    app.kubernetes.io/part-of: nutrigraph-ai
spec:
  type: ClusterIP
  selector:
    app: consul
  ports:
    - name: http
      port: 8500
      targetPort: 8500
