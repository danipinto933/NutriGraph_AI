apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: default
  labels:
    app: user-auth-service
    app.kubernetes.io/part-of: nutrigraph-ai
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-auth-service
  template:
    metadata:
      labels:
        app: user-auth-service
    spec:
      containers:
        - name: user-auth-service
          image: nutrigraph/user-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PROJECT_NAME
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: PROJECT_NAME_USER_AUTH
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: NEO4J_URI
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nutrigraph-secrets
                  key: JWT_SECRET
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nutrigraph-secrets
                  key: NEO4J_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-auth-service
  namespace: default
  labels:
    app: user-auth-service
    app.kubernetes.io/part-of: nutrigraph-ai
spec:
  type: ClusterIP
  selector:
    app: user-auth-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
