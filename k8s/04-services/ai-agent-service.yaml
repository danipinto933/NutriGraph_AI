apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service
  namespace: default
  labels:
    app: ai-agent-service
    app.kubernetes.io/part-of: nutrigraph-ai
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-service
  template:
    metadata:
      labels:
        app: ai-agent-service
    spec:
      containers:
        - name: ai-agent-service
          image: nutrigraph/ai-agent-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PROJECT_NAME
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: PROJECT_NAME_AI_AGENT
            - name: NUTRITION_GRAPH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: NUTRITION_GRAPH_SERVICE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: REDIS_URL
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: NEO4J_URI
            - name: OPENAI_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: OPENAI_API_BASE
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: nutrigraph-config
                  key: LLM_MODEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nutrigraph-secrets
                  key: OPENAI_API_KEY
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: nutrigraph-secrets
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nutrigraph-secrets
                  key: NEO4J_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
  namespace: default
  labels:
    app: ai-agent-service
    app.kubernetes.io/part-of: nutrigraph-ai
spec:
  type: ClusterIP
  selector:
    app: ai-agent-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
