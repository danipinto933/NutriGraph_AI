services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - nutrigraph_network

  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - nutrigraph_network

  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password}
      - NEO4J_PLUGINS=${NEO4J_PLUGINS:-["apoc"]}
      - NEO4J_dbms_security_procedures_unrestricted=${NEO4J_dbms_security_procedures_unrestricted:-apoc.*}
    volumes:
      - neo4j_data:/data
    networks:
      - nutrigraph_network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - nutrigraph_network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - nutrigraph_network

  user-auth-service:
    build:
      context: .
      dockerfile: services/user-auth-service/Dockerfile
    container_name: user-auth-service
    ports:
      - "8000:8000"
    restart: on-failure
    environment:
      - PROJECT_NAME=User & Auth Service
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    env_file:
      - .env
    depends_on:
      - neo4j
      - kafka
    networks:
      - nutrigraph_network

  nutrition-graph-service:
    build:
      context: .
      dockerfile: services/nutrition-graph-service/Dockerfile
    container_name: nutrition-graph-service
    ports:
      - "8001:8000"
    restart: on-failure
    environment:
      - PROJECT_NAME=Nutrition Graph Service
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    env_file:
      - .env
    depends_on:
      - neo4j
      - kafka
    networks:
      - nutrigraph_network

  ai-agent-service:
    build:
      context: .
      dockerfile: services/ai-agent-service/Dockerfile
    container_name: ai-agent-service
    ports:
      - "8002:8000"
    restart: on-failure
    environment:
      - PROJECT_NAME=AI Agent Service
      - NUTRITION_GRAPH_SERVICE_URL=http://nutrition-graph-service:8000/api/v1
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
    env_file:
      - .env
    depends_on:
      - redis
      - nutrition-graph-service
      - neo4j
    networks:
      - nutrigraph_network

  frontend:
    build:
      context: ./frontend/angular-app
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:80"
    networks:
      - nutrigraph_network
    depends_on:
      - ai-agent-service
      - nutrition-graph-service

networks:
  nutrigraph_network:
    driver: bridge

volumes:
  neo4j_data:
